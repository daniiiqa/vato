[package]
name = "vato"
version = "0.1.0"
edition = "2024"
description = "El vato que le sabe a todo: audio, bluetooth, red y sistema en la terminal (discada)"
license = "MIT"

[dependencies]
ratatui = "0.29"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
